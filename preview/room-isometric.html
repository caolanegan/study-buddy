<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Buddy Isometric</title>
<style>
  :root {
    --bg: #1d1b26; --panel: #2a2736; --panel2: #34303f; --ink: #f3ead8; --muted: #a79fb5;
    --accent: #f2b134; --go: #5fbf77; --warn: #e0864a; --stop: #d9534f; --line: #463f55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--accent); }
  .stage { background: #2a2736; border-radius: 14px; overflow: hidden; border: 3px solid var(--line); position: relative; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 10; height: auto; }
  .simbar { position: absolute; left: 8px; top: 8px; background: rgba(20,18,28,.55); padding: 4px 10px; border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums; backdrop-filter: blur(4px); }
  .session { background: var(--panel); border-radius: 14px; margin-top: 12px; padding: 16px; text-align: center; border: 1px solid var(--line); }
  .timer { font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px 26px; font-size: 18px; font-weight: 700; cursor: pointer; color: #1d1b26; }
  .start { background: var(--go); min-width: 220px; }
  .pause { background: var(--accent); }
  .end { background: var(--stop); color: #fff; }
  .hidden { display: none; }
  .preview { margin-top: 16px; background: var(--panel2); border-radius: 14px; padding: 14px; border: 1px dashed var(--muted); }
  .preview h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 14px; }
  .row button { padding: 6px 12px; font-size: 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .row button.on { background: var(--accent); color: #1d1b26; }
  input[type=range] { flex: 1; min-width: 160px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📚 Study Buddy</h1>
    <div class="chips">
      <span class="chip">⏱ <b>42.5h</b> total</span>
      <span class="chip">🪙 <b>1,240</b></span>
      <span class="chip">🔥 <b>5-day</b> streak ×1.5</span>
    </div>
  </header>

  <div class="stage">
    <canvas id="room"></canvas>
    <div class="simbar" id="simbar">Day 43 · Autumn · 08:00</div>
  </div>

  <div class="session">
    <div class="timer" id="timer">00:00:00</div>
    <div class="sub" id="sub">Ready when you are</div>
    <div class="btns">
      <button class="start" id="startBtn">▶ Start studying</button>
      <button class="pause hidden" id="pauseBtn">❚❚ Pause</button>
      <button class="end hidden" id="endBtn">■ End session</button>
    </div>
  </div>

  <div class="preview">
    <h2>Preview controls (not part of the real app)</h2>
    <div class="row">Time of day <input type="range" id="tod" min="0" max="1000" value="80"> <span id="todLbl"></span></div>
    <div class="row">Season
      <button data-s="0">Spring</button><button data-s="1">Summer</button><button data-s="2" class="on">Autumn</button><button data-s="3">Winter</button>
    </div>
    <div class="row">
      <button id="ffBtn">⏩ Fast-forward day/night</button>
      <button id="upBtn">✨ Show sample upgrades</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
//  Study Buddy — cartoony isometric diorama preview (canvas, vector paths)
// =====================================================================
const $ = id => document.getElementById(id);
const CW = 960, CH = 600;                       // logical canvas size (16:10)
const cv = $('room');
const g = cv.getContext('2d');
let SCALE = 1;
function resize() {
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 828;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr * CH / CW);
  SCALE = cv.width / CW;
}
window.addEventListener('resize', resize); resize();

const state = { t: 0.08, season: 2, ff: false, upgrades: false, studying: false, paused: false, elapsed: 0 };
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];

// ---------- colour helpers ----------
const HX = new Map();
const hx = h => { let c = HX.get(h); if (!c) { c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); HX.set(h, c); } return c; };
const mixA = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
let LIGHT = [255, 255, 255];          // multiplicative room light colour (day → dusk → night)
// C(): room colour, optionally lightened (k>0) or darkened (k<0), multiplied by current room light
function C(h, k = 0, a = 1) {
  let c = typeof h === 'string' ? hx(h) : h;
  if (k > 0) c = mixA(c, [255, 249, 238], k); else if (k < 0) c = mixA(c, [52, 32, 44], -k);
  return rgba([c[0] * LIGHT[0] / 255, c[1] * LIGHT[1] / 255, c[2] * LIGHT[2] / 255], a);
}
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = k => k * k * (3 - 2 * k);

// ---------- time of day ----------
// t: 0 = sunrise, 0.5 = sunset. [t, skyTop, skyBottom, daylight, roomLight]
const KEYS = [
  [0.00, '#6a6db0', '#f7b593', 0.45, '#e8c8c8'],
  [0.06, '#74bdf0', '#d2f0fc', 1.00, '#ffffff'],
  [0.42, '#74bdf0', '#d2f0fc', 1.00, '#ffffff'],
  [0.47, '#8aa6dc', '#ffd59c', 0.85, '#fff0dc'],
  [0.50, '#5f4b92', '#f79a6c', 0.45, '#f2bea4'],
  [0.56, '#0f1638', '#2b3672', 0.00, '#6b72b4'],
  [0.94, '#0f1638', '#2b3672', 0.00, '#6b72b4'],
  [1.00, '#6a6db0', '#f7b593', 0.45, '#e8c8c8'],
];
function sky(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [a, at, ab, ad, al] = KEYS[i], [b, bt, bb, bd, bl] = KEYS[i + 1];
    if (t >= a && t <= b) {
      const k = (t - a) / (b - a);
      return { top: mixA(hx(at), hx(bt), k), bot: mixA(hx(ab), hx(bb), k), day: ad + (bd - ad) * k, light: mixA(hx(al), hx(bl), k) };
    }
  }
  return { top: hx('#0f1638'), bot: hx('#2b3672'), day: 0, light: hx('#6b72b4') };
}
function clockStr(t) { // sunrise at 06:00
  const mins = Math.floor(((t * 24 + 6) % 24) * 60);
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
}

// ---------- isometric projection (2:1) ----------
const U = 30, ZU = 33, OX = 474, OY = 251, ZOOM = 1.06;
const RW = 9.4, RD = 9.0, RH = 5.9, WT = 0.38, SL = 0.62;   // room width/depth/height, wall thickness, slab
const P = (x, y, z = 0) => [OX + (x - y) * U, OY + (x + y) * U / 2 - z * ZU];
function path(pts) { g.beginPath(); pts.forEach((p, i) => { const s = P(p[0], p[1], p[2]); i ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1]); }); g.closePath(); }
function face(pts, fill) { path(pts); g.fillStyle = fill; g.fill(); g.lineJoin = 'round'; g.lineWidth = 1; g.strokeStyle = fill; g.stroke(); }
// box with three tones: top lighter, +y face (lit by window) mid, +x face darker
function box(x, y, z, w, d, h, base, edge = true) {
  face([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], C(base));
  face([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], C(base, -0.17));
  face([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], C(base, 0.16));
  if (edge) { const a = P(x, y + d, z + h), b = P(x + w, y + d, z + h), c = P(x + w, y, z + h);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]);
    g.strokeStyle = C(base, 0.42, 0.9); g.lineWidth = 1.2; g.lineCap = 'round'; g.stroke(); }
}
// draw in a plane's local 2D coordinates (s local px per iso unit)
function plane(o, ux, uy, fn) {
  const O = P(o[0], o[1], o[2]), A = P(o[0] + ux[0], o[1] + ux[1], o[2] + ux[2]), B = P(o[0] + uy[0], o[1] + uy[1], o[2] + uy[2]);
  g.save(); g.transform(A[0] - O[0], A[1] - O[1], B[0] - O[0], B[1] - O[1], O[0], O[1]); fn(); g.restore();
}
const onLeftWall = (y, z, s, fn) => plane([0, y, z], [0, -1 / s, 0], [0, 0, -1 / s], fn); // plane x=const (lx → back)
const onX = (x, y, z, s, fn) => plane([x, y, z], [0, -1 / s, 0], [0, 0, -1 / s], fn);
const onY = (x, y, z, s, fn) => plane([x, y, z], [1 / s, 0, 0], [0, 0, -1 / s], fn);       // plane y=const (lx → +x)
const onZ = (x, y, z, s, fn) => plane([x, y, z], [1 / s, 0, 0], [0, 1 / s, 0], fn);        // horizontal plane

function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
function fillE(x, y, rx, ry, c, rot = 0) { ell(x, y, rx, ry, rot); g.fillStyle = c; g.fill(); }
const V = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const lerp2 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
// rounded polygon through corner control points
function roundPoly(pts, f = 0.35) {
  const n = pts.length; g.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    const a = lerp2(p1, p0, f), b = lerp2(p1, p2, f);
    i ? g.lineTo(a[0], a[1]) : g.moveTo(a[0], a[1]);
    g.quadraticCurveTo(p1[0], p1[1], b[0], b[1]);
  }
  g.closePath();
}
// simple vertical cylinder (screen space) — r in iso units, h in iso units
function cyl(x, y, z, r, h, body, topC) {
  const [cx, cy] = P(x, y, z), rx = r * U * 1.414, ry = rx / 2, hh = h * ZU;
  g.fillStyle = body; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); g.lineTo(cx - rx, cy - hh); g.ellipse(cx, cy - hh, rx, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
  fillE(cx, cy - hh, rx, ry, topC);
  return [cx, cy - hh, rx, ry];
}

// ---------- static data ----------
const CODE = (() => { const r = rnd(42); return Array.from({ length: 64 }, () => { const ind = (r() * 3 | 0) * 6; const segs = []; let n = 1 + (r() * 3 | 0); while (n--) segs.push([6 + (r() * 18 | 0), ['#7fd1b9', '#f2b134', '#c792ea', '#82aaff', '#e9e4da', '#f78c6c'][r() * 6 | 0]]); return { ind, segs }; }); })();
const STARS = (() => { const r = rnd(7); return Array.from({ length: 34 }, () => [r() * 152, r() * 70, r()]); })();
const BGSTARS = (() => { const r = rnd(19); return Array.from({ length: 70 }, () => [r() * CW, r() * CH * 0.75, r()]); })();
const BOOKS = (() => { const r = rnd(5); const cols = ['#d9665b', '#f2b134', '#5b84c4', '#7fb48a', '#c792ea', '#e8dcc6', '#e0864a', '#4f8a8b'];
  return [0, 1, 2, 3].map(() => { const row = []; let x = 0; while (x < 72) { const w = 6 + (r() * 5 | 0); row.push([x, w, 22 + (r() * 10 | 0), cols[r() * cols.length | 0]]); x += w + 1; } return row; }); })();
let particles = [];

// ---------- background & shadow ----------
const shadowC = document.createElement('canvas');
(function buildShadow() {
  shadowC.width = CW; shadowC.height = CH; const s = shadowC.getContext('2d');
  s.filter = 'blur(16px)'; s.fillStyle = '#000';
  const pts = [P(-WT, -WT, -SL), P(RW, -WT, -SL), P(RW, RD, -SL), P(-WT, RD, -SL)];
  s.beginPath(); pts.forEach((p, i) => (i ? s.lineTo : s.moveTo).call(s, p[0], p[1] + 16)); s.closePath(); s.fill();
})();
function drawBackground(sk, time) {
  const night = 1 - sk.day;
  const top = mixA(sk.top, [255, 250, 245], 0.32 * sk.day + 0.04), bot = mixA(sk.bot, [255, 244, 232], 0.45 * sk.day + 0.06);
  let gr = g.createLinearGradient(0, 0, 0, CH); gr.addColorStop(0, rgba(top)); gr.addColorStop(1, rgba(bot));
  g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
  gr = g.createRadialGradient(OX, 300, 40, OX, 300, 470);
  gr.addColorStop(0, `rgba(255,250,235,${0.28 * sk.day + 0.06})`); gr.addColorStop(1, 'rgba(255,250,235,0)');
  g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
  // soft bokeh circles
  for (let i = 0; i < 7; i++) {
    const x = (i * 157 + 60 + Math.sin(time * 0.1 + i) * 12) % CW, y = 70 + ((i * 97) % 420), r = 30 + (i * 23) % 50;
    fillE(x, y, r, r, `rgba(255,255,255,${0.012 + 0.035 * sk.day})`);
  }
  if (night > 0.2) for (const [x, y, p] of BGSTARS) {
    const a = (night - 0.2) * (0.35 + 0.35 * Math.sin(time * 1.5 + p * 30));
    fillE(x, y, 0.8 + p, 0.8 + p, `rgba(255,248,220,${a})`);
  }
}

// ---------- room shell ----------
function drawShell() {
  // slab sides
  face([[-WT, RD, 0], [RW, RD, 0], [RW, RD, -SL], [-WT, RD, -SL]], C('#b07a52'));
  face([[RW, -WT, 0], [RW, RD, 0], [RW, RD, -SL], [RW, -WT, -SL]], C('#8e5e40'));
  // wood stripe on slab edge
  face([[-WT, RD, -0.12], [RW, RD, -0.12], [RW, RD, 0], [-WT, RD, 0]], C('#d7a57a'));
  face([[RW, -WT, -0.12], [RW, RD, -0.12], [RW, RD, 0], [RW, -WT, 0]], C('#b98a63'));
  // floor
  face([[0, 0, 0], [RW, 0, 0], [RW, RD, 0], [0, RD, 0]], C('#cf976b'));
  onZ(0, 0, 0, 40, () => {
    g.beginPath(); g.rect(0, 0, RW * 40, RD * 40); g.clip();
    g.strokeStyle = C('#b97f55'); g.lineWidth = 1.6; g.lineCap = 'round';
    for (let j = 1; j < 14; j++) { const y = j * 400 / 14; g.beginPath(); g.moveTo(2, y); g.lineTo(398, y); g.stroke(); }
    const r = rnd(3);
    for (let j = 0; j < 14; j++) { const y0 = j * 400 / 14; let x = r() * 90; while (x < 396) { g.beginPath(); g.moveTo(x, y0 + 3); g.lineTo(x, y0 + 400 / 14 - 3); g.stroke(); x += 110 + r() * 60; } }
    // ambient occlusion along walls
    let gr = g.createLinearGradient(0, 0, 0, 34); gr.addColorStop(0, C('#5a3020', 0, 0.28)); gr.addColorStop(1, C('#5a3020', 0, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 400, 34);
    gr = g.createLinearGradient(0, 0, 34, 0); gr.addColorStop(0, C('#5a3020', 0, 0.28)); gr.addColorStop(1, C('#5a3020', 0, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 34, 400);
  });
  // walls (inner faces)
  face([[0, 0, 0], [0, RD, 0], [0, RD, RH], [0, 0, RH]], C('#f8e3cb'));
  face([[0, 0, 0], [RW, 0, 0], [RW, 0, RH], [0, 0, RH]], C('#efd2b1'));
  const wallDeco = (base, len) => {
    const H = RH * 40, wz = 1.55 * 40;
    g.fillStyle = C(base, -0.05, 0.55);
    for (let x = 6; x < len; x += 26) rr(x, 0, 11, H - wz, 5), g.fill();
    g.fillStyle = C(base, -0.1); g.fillRect(0, H - wz, len, wz);                 // wainscot
    g.fillStyle = C(base, -0.16); for (let x = 10; x < len - 20; x += 44) { rr(x, H - wz + 12, 34, wz - 26, 4); g.fill(); }
    g.fillStyle = C(base, -0.06); for (let x = 12; x < len - 20; x += 44) { rr(x + 2, H - wz + 14, 30, wz - 30, 3); g.fill(); }
    g.fillStyle = C('#fff8ee'); g.fillRect(0, H - wz - 5, len, 6);                // chair rail
    g.fillStyle = C('#fff8ee'); g.fillRect(0, H - 8, len, 8);                     // baseboard
    // vertical corner occlusion + top shade
    let gr = g.createLinearGradient(0, 0, 0, 40); gr.addColorStop(0, C('#6a4030', 0, 0.12)); gr.addColorStop(1, C('#6a4030', 0, 0)); g.fillStyle = gr; g.fillRect(0, 0, len, 40);
  };
  onLeftWall(RD, RH, 40, () => { const L = RD * 40; wallDeco('#f8e3cb', L);
    const gr = g.createLinearGradient(L, 0, L - 30, 0); gr.addColorStop(0, C('#6a4030', 0, 0.2)); gr.addColorStop(1, C('#6a4030', 0, 0)); g.fillStyle = gr; g.fillRect(L - 30, 0, 30, RH * 40); });
  onY(0, 0, RH, 40, () => { wallDeco('#efd2b1', RW * 40);
    const gr = g.createLinearGradient(0, 0, 30, 0); gr.addColorStop(0, C('#6a4030', 0, 0.22)); gr.addColorStop(1, C('#6a4030', 0, 0)); g.fillStyle = gr; g.fillRect(0, 0, 30, RH * 40); });
  // wall end faces & caps (cutaway)
  face([[-WT, RD, 0], [0, RD, 0], [0, RD, RH], [-WT, RD, RH]], C('#d8b08a'));
  face([[RW, -WT, 0], [RW, 0, 0], [RW, 0, RH], [RW, -WT, RH]], C('#c09775'));
  face([[-WT, -WT, RH], [RW, -WT, RH], [RW, 0, RH], [0, 0, RH], [0, RD, RH], [-WT, RD, RH]], C('#fff4e6'));
}

// ---------- window (left wall) ----------
const WIN = { y: 7.0, z: 5.2, s: 40, w: 152, h: 120 };   // local glass 152×120 px, y 3.2..7.0, z 2.4..5.4
function drawWindow(sk, time, dt) {
  onLeftWall(WIN.y, WIN.z, WIN.s, () => {
    const { w, h } = WIN;
    // frame
    g.fillStyle = C('#5a3a2a', 0, 0.12); rr(-8, -6, w + 16, h + 18, 6); g.fill();
    g.fillStyle = C('#fff7ec'); rr(-9, -9, w + 18, h + 18, 6); g.fill();
    g.save(); g.beginPath(); g.rect(0, 0, w, h); g.clip();
    drawOutside(sk, time, dt);
    // glass reflections
    g.fillStyle = 'rgba(255,255,255,0.07)';
    g.beginPath(); g.moveTo(20, 0); g.lineTo(46, 0); g.lineTo(6, h); g.lineTo(-20, h); g.fill();
    g.beginPath(); g.moveTo(100, 0); g.lineTo(110, 0); g.lineTo(70, h); g.lineTo(60, h); g.fill();
    // recess shadow
    g.fillStyle = 'rgba(40,20,30,0.18)'; g.fillRect(0, 0, w, 4); g.fillRect(w - 4, 0, 4, h);
    g.restore();
    g.fillStyle = C('#fff7ec'); g.fillRect(w / 2 - 3, 0, 6, h); g.fillRect(0, 54, w, 5);
    g.fillStyle = C('#d9c7b0'); g.fillRect(w / 2 + 2, 0, 1.5, h); g.fillRect(0, 58, w, 1.2);
    // curtain rod
    g.strokeStyle = C('#7a5038'); g.lineWidth = 3.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-46, -20); g.lineTo(w + 46, -20); g.stroke();
    fillE(-48, -20, 4.5, 4.5, C('#9b6a48')); fillE(w + 48, -20, 4.5, 4.5, C('#9b6a48'));
    // curtains
    const curtain = (x0, x1, side) => {   // side: -1 left (ties to left), +1 right
      const out = side < 0 ? x0 : x1, inn = side < 0 ? x1 : x0;
      const gr = g.createLinearGradient(x0, 0, x1, 0);
      for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, i % 2 ? C('#d86f57') : C('#ea8a6f'));

  back: { lean: -0.22, hR: [-13, -60], hL: [-22, -64], eR: [19, -4], eL: [-17, -6], over: 1, mug: 0, happy: 0 },
  sip:  { lean: -0.04, hR: [17, -54], hL: [16, -14], eR: [10, 12], eL: [2, 7], over: 1, mug: 1, happy: 0 },

let curPose = null;

}
function blendPose(target, dt) {
  if (!curPose) { curPose = JSON.parse(JSON.stringify(target)); return curPose; }
  const k = 1 - Math.exp(-dt * 5);
  for (const key of ['lean', 'over', 'mug', 'happy']) curPose[key] += (target[key] - curPose[key]) * k;
  for (const key of ['hR', 'hL', 'eR', 'eL']) curPose[key] = lerp2(curPose[key], target[key], k);

}

  g.beginPath(); g.moveTo(sh[0], sh[1]); g.quadraticCurveTo(ctrl[0], ctrl[1], hand[0], hand[1]); g.stroke();

  onZ(5.6, 6.5, 0.01, 40, () => {
    fillE(2, 3, 74, 74, C('#5a3020', 0, 0.12));
    fillE(0, 0, 72, 72, C('#6f93bd')); fillE(0, 0, 63, 63, C('#f3e3c4')); fillE(0, 0, 57, 57, C('#e07a5f'));
    fillE(0, 0, 44, 44, C('#f3e3c4')); fillE(0, 0, 38, 38, C('#6f93bd'));
    g.fillStyle = C('#f3e3c4'); for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; fillE(Math.cos(a) * 50, Math.sin(a) * 50, 2.4, 2.4, C('#f3e3c4')); }
    fillE(0, 0, 12, 12, C('#f2b134'));
  });
}
function drawBeanbag() {
  const [x, y] = P(2.3, 7.1, 0);
  fillE(x + 2, y + 1, 38, 14, C('#5a3020', 0, 0.2));
  const base = '#e59a7f';
  // back lump (towards wall)
  g.fillStyle = C(base, -0.08);
  g.beginPath(); g.moveTo(x - 30, y - 14); g.bezierCurveTo(x - 36, y - 46, x - 6, y - 62, x + 8, y - 44); g.bezierCurveTo(x + 12, y - 34, x + 4, y - 22, x - 6, y - 18); g.closePath(); g.fill();
  fillE(x - 18, y - 44, 9, 5, C(base, 0.25, 0.8), -0.7);
  // seat mound
  g.fillStyle = C(base);
  g.beginPath(); g.moveTo(x - 36, y - 4);
  g.bezierCurveTo(x - 40, y - 26, x - 14, y - 32, x + 4, y - 28);
  g.bezierCurveTo(x + 26, y - 30, x + 40, y - 18, x + 36, y - 4);
  g.bezierCurveTo(x + 30, y + 12, x - 30, y + 12, x - 36, y - 4); g.fill();
  g.fillStyle = C(base, -0.14); g.beginPath(); g.moveTo(x + 36, y - 4); g.bezierCurveTo(x + 30, y + 12, x - 14, y + 13, x - 24, y + 6); g.bezierCurveTo(x, y + 4, x + 28, y, x + 36, y - 4); g.fill();
  fillE(x + 2, y - 20, 18, 6.5, C(base, 0.18), -0.1);   // seat dent highlight
  g.strokeStyle = C(base, -0.2); g.lineWidth = 1.3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - 30, y - 8); g.quadraticCurveTo(x - 6, y + 2, x + 24, y - 10); g.stroke();
}
function drawCat(time) {
  const [x, y] = P(6.35, 6.95, 0);
  fillE(x + 2, y + 1, 24, 8, C('#5a3020', 0, 0.2));
  const br = 1 + Math.sin(time * 1.8) * 0.03;
  fillE(x, y - 9, 21, 12 * br, C('#e9934a'));
  fillE(x - 2, y - 12, 15, 7, C('#f2a862'));
  g.strokeStyle = C('#c9702e'); g.lineWidth = 2.2; g.lineCap = 'round';
  for (const dx of [-2, 5, 12]) { g.beginPath(); g.arc(x + dx, y - 8, 9, 4.3, 5.0); g.stroke(); }
  // head
  const hx2 = x - 16, hy = y - 9;
  g.fillStyle = C('#e9934a');
  g.beginPath(); g.moveTo(hx2 - 9, hy - 4); g.lineTo(hx2 - 8, hy - 15); g.lineTo(hx2 - 2, hy - 8); g.fill();
  g.beginPath(); g.moveTo(hx2 + 2, hy - 8); g.lineTo(hx2 + 7, hy - 15); g.lineTo(hx2 + 9, hy - 4); g.fill();
  fillE(hx2 - 7, hy - 10, 1.6, 2.6, C('#f4a7a7'), -0.2); fillE(hx2 + 6, hy - 10, 1.6, 2.6, C('#f4a7a7'), 0.3);
  fillE(hx2, hy, 10.5, 9, C('#f2a862'));
  fillE(hx2 + 1, hy + 4, 5, 3.2, C('#fbe3c8'));
  g.strokeStyle = C('#4a2e22'); g.lineWidth = 1.3;
  g.beginPath(); g.arc(hx2 - 4, hy - 0.5, 2.2, 0.2, Math.PI - 0.2); g.stroke(); g.beginPath(); g.arc(hx2 + 4, hy - 0.5, 2.2, 0.2, Math.PI - 0.2); g.stroke();
  fillE(hx2, hy + 2.6, 1.2, 0.9, C('#e57b7b'));
  fillE(hx2 + 8, hy + 6, 4, 2.6, C('#fbe3c8'));
  // tail swish
  const sw = Math.sin(time * 2.2) * 6;
  g.strokeStyle = C('#e9934a'); g.lineWidth = 6;
  g.beginPath(); g.moveTo(x + 18, y - 4); g.quadraticCurveTo(x + 22, y + 4, x + 6, y + 3); g.quadraticCurveTo(x - 4, y + 3 + sw * 0.2, x - 10 + sw * 0.3, y - 1 + sw * 0.4); g.stroke();
  fillE(x - 10 + sw * 0.3, y - 1 + sw * 0.4, 3.2, 3.2, C('#c9702e'));
}
function drawFloorPlant(time) {
  const [cx, cy, rx] = cyl(0.95, 8.25, 0, 0.42, 0.9, C('#f3e8d6'), C('#6b4532'));
  g.fillStyle = C('#e6d6bd'); g.fillRect(cx - rx, cy + 8, rx * 2, 3);
  const sw = Math.sin(time * 0.8) * 0.04;
  const leaves = [[-1.9, 36, '#4f9a4f'], [-1.2, 42, '#5aa65a'], [-0.5, 38, '#4f9a4f'], [-2.5, 30, '#5aa65a'], [-0.9, 30, '#6fb36a'], [-1.55, 28, '#7cc06f']];
  for (const [a, l, c] of leaves) {
    const aa = a + sw, ex = cx + Math.cos(aa) * l, ey = cy + Math.sin(aa) * l;
    g.strokeStyle = C('#4a7a3a'); g.lineWidth = 1.8; g.beginPath(); g.moveTo(cx, cy); g.quadraticCurveTo(cx + Math.cos(aa) * l * 0.5, cy + Math.sin(aa) * l * 0.6 - 6, ex, ey); g.stroke();
    g.save(); g.translate(ex, ey); g.rotate(aa + Math.PI / 2);
    g.fillStyle = C(c); g.beginPath(); g.moveTo(0, 6); g.bezierCurveTo(-13, 0, -10, -16, 0, -20); g.bezierCurveTo(10, -16, 13, 0, 0, 6); g.fill();
    g.strokeStyle = C(c, 0.3); g.lineWidth = 1; g.beginPath(); g.moveTo(0, 4); g.lineTo(0, -16); g.stroke();
    g.restore();
  }
}

// ---------- light: daylight patch & glows ----------
function windowPatch(sk, night) {
  const p = state.t < 0.5 ? state.t / 0.5 : (state.t - 0.5) / 0.5, elev = Math.sin(Math.PI * p);
  const dx = 0.6 + 0.4 * (1 - elev), dy = (p - 0.5) * 0.8;
  const pane = (y0, y1, z0, z1) => [[z0 * dx, y0 + z0 * dy], [z0 * dx, y1 + z0 * dy], [z1 * dx, y1 + z1 * dy], [z1 * dx, y0 + z1 * dy]];
  const panes = [pane(5.15, 7.0, 2.2, 3.75), pane(3.2, 5.05, 2.2, 3.75), pane(5.15, 7.0, 3.9, 5.2), pane(3.2, 5.05, 3.9, 5.2)];
  const draw = col => { g.fillStyle = col; for (const q of panes) { g.beginPath(); q.forEach(([x, y], i) => { const s = P(x, y, 0.01); i ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1]); }); g.closePath(); g.fill(); } };
  if (sk.day > 0.02) { const warm = 1 - clamp((sk.day - 0.45) / 0.55, 0, 1); draw(rgba(mixA([255, 238, 196], [255, 170, 110], warm), 0.3 * sk.day * clamp(elev * 4, 0.3, 1))); }
  if (night > 0.3) draw(`rgba(150,170,255,${0.08 * night * clamp(elev * 4, 0, 1)})`);
}
const SIL = () => { const p = new Path2D(); [P(0, RD, 0), P(0, RD, RH), P(0, 0, RH), P(RW, 0, RH), P(RW, 0, 0), P(RW, RD, 0)].forEach((s, i) => i ? p.lineTo(s[0], s[1]) : p.moveTo(s[0], s[1])); p.closePath(); return p; };
const ROOMPATH = SIL();
function drawGlows(sk, time) {
  const night = 1 - sk.day, typing = state.studying && !state.paused;
  g.save(); g.clip(ROOMPATH); g.globalCompositeOperation = 'lighter';
  let [mx, my] = P(6.3, 0.7, 3.0);
  let a = (state.studying ? 0.05 + 0.3 * night : 0.03 + 0.12 * night) * (typing ? 1 + Math.sin(time * 6) * 0.03 : 1);
  let gr = g.createRadialGradient(mx, my, 10, mx, my + 30, 200); gr.addColorStop(0, `rgba(110,160,255,${a})`); gr.addColorStop(1, 'rgba(110,160,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
  if (state.upgrades) {
    const [lx, ly] = P(8.0, 0.75, 2.4);
    gr = g.createRadialGradient(lx, ly, 4, lx, ly + 10, 150); gr.addColorStop(0, `rgba(255,190,110,${0.05 + 0.26 * night})`); gr.addColorStop(1, 'rgba(255,190,110,0)');
    g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
    onZ(7.8, 0.9, 1.99, 40, () => { gr = g.createRadialGradient(0, 0, 2, 0, 0, 36); gr.addColorStop(0, `rgba(255,214,140,${0.1 + 0.4 * night})`); gr.addColorStop(1, 'rgba(255,214,140,0)'); g.fillStyle = gr; g.fillRect(-40, -40, 80, 80); });
  }
  g.restore();
}

// ---------- frame ----------
function render(time, dt) {
  const sk = sky(state.t), night = 1 - sk.day;
  LIGHT = sk.light;
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  drawBackground(sk, time);
  g.setTransform(SCALE * ZOOM, 0, 0, SCALE * ZOOM, SCALE * 480 * (1 - ZOOM), SCALE * 300 * (1 - ZOOM));
  g.globalAlpha = 0.22 + 0.12 * night; g.drawImage(shadowC, 0, 0, CW, CH); g.globalAlpha = 1;
  drawShell();
  drawWindow(sk, time, dt);
  drawRightWallDecor();
  windowPatch(sk, night);
  if (state.upgrades) drawRug();
  drawBeanbag();
  drawBookshelf();
  drawDesk(time);
  drawChairBase();
  const pose = drawCharacter(time, dt);
  drawChairBack();
  if (pose.mug < 0.5) { const [cx, cy] = P(...MUG_DESK); drawMug(cx, cy); }
  if (state.upgrades) drawCat(time);
  drawFloorPlant(time);
  drawGlows(sk, time);
  if (pose.mug < 0.5) { const [cx, cy] = P(...MUG_DESK); drawSteam(cx, cy - 15, time); }
}

// ---------- loop & UI ----------
let last = performance.now();
function fmt(s) { s = Math.floor(s); return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':'); }
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (state.ff) { state.t = (state.t + dt / 20) % 1; $('tod').value = state.t * 1000; }
  if (state.studying && !state.paused) { state.elapsed += dt; if (!state.ff) state.t = (state.t + dt / 3600) % 1; }
  $('timer').textContent = fmt(state.elapsed);
  $('todLbl').textContent = clockStr(state.t) + (state.t < 0.5 ? ' ☀️' : ' 🌙');
  $('simbar').textContent = `Day 43 · ${SEASONS[state.season]} (day 3/10) · ${clockStr(state.t)}`;
  render(now / 1000, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('tod').oninput = e => { state.t = e.target.value / 1000; state.ff = false; $('ffBtn').classList.remove('on'); };
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  state.season = +b.dataset.s; particles = [];
  document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
});
$('ffBtn').onclick = () => { state.ff = !state.ff; $('ffBtn').classList.toggle('on', state.ff); };
$('upBtn').onclick = () => { state.upgrades = !state.upgrades; $('upBtn').classList.toggle('on', state.upgrades); };
$('startBtn').onclick = () => {
  state.studying = true; state.paused = false;
  $('startBtn').classList.add('hidden'); $('pauseBtn').classList.remove('hidden'); $('endBtn').classList.remove('hidden');
  $('sub').textContent = 'Studying… next coin in 59:59';
};
$('pauseBtn').onclick = () => {
  state.paused = !state.paused; $('pauseBtn').textContent = state.paused ? '▶ Resume' : '❚❚ Pause';
  $('sub').textContent = state.paused ? 'Paused' : 'Studying…';
};
$('endBtn').onclick = () => {
  state.studying = false; state.paused = false; state.elapsed = 0;
  $('startBtn').classList.remove('hidden'); $('pauseBtn').classList.add('hidden'); $('endBtn').classList.add('hidden');
  $('pauseBtn').textContent = '❚❚ Pause'; $('sub').textContent = 'Session saved! (preview only)';
};
// URL params for screenshots: ?t=0.2&s=1&u=1&study=1
const q = new URLSearchParams(location.search);
if (q.has('t')) state.t = +q.get('t');
if (q.has('s')) document.querySelector(`[data-s="${q.get('s')}"]`).click();
if (q.get('u') === '1') $('upBtn').click();
if (q.get('study') === '1') $('startBtn').click();
$('tod').value = state.t * 1000;
</script>
