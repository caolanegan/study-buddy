<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Buddy Cartoon</title>
<style>
  :root {
    --bg: #1d1b26; --panel: #2a2736; --panel2: #34303f; --ink: #f3ead8; --muted: #a79fb5;
    --accent: #f2b134; --go: #5fbf77; --warn: #e0864a; --stop: #d9534f; --line: #463f55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--accent); }
  .stage { background: #000; border-radius: 14px; overflow: hidden; border: 3px solid var(--line); position: relative; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; }
  .simbar { position: absolute; left: 8px; top: 8px; background: rgba(20,18,28,.7); padding: 4px 10px; border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .session { background: var(--panel); border-radius: 14px; margin-top: 12px; padding: 16px; text-align: center; border: 1px solid var(--line); }
  .timer { font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px 26px; font-size: 18px; font-weight: 700; cursor: pointer; color: #1d1b26; }
  .start { background: var(--go); min-width: 220px; }
  .pause { background: var(--accent); }
  .end { background: var(--stop); color: #fff; }
  .hidden { display: none; }
  .preview { margin-top: 16px; background: var(--panel2); border-radius: 14px; padding: 14px; border: 1px dashed var(--muted); }
  .preview h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 14px; }
  .row button { padding: 6px 12px; font-size: 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .row button.on { background: var(--accent); color: #1d1b26; }
  input[type=range] { flex: 1; min-width: 160px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📚 Study Buddy</h1>
    <div class="chips">
      <span class="chip">⏱ <b>42.5h</b> total</span>
      <span class="chip">🪙 <b>1,240</b></span>
      <span class="chip">🔥 <b>5-day</b> streak ×1.5</span>
    </div>
  </header>

  <div class="stage">
    <canvas id="room"></canvas>
    <div class="simbar" id="simbar">Day 43 · Autumn · 08:00</div>
  </div>

  <div class="session">
    <div class="timer" id="timer">00:00:00</div>
    <div class="sub" id="sub">Ready when you are</div>
    <div class="btns">
      <button class="start" id="startBtn">▶ Start studying</button>
      <button class="pause hidden" id="pauseBtn">❚❚ Pause</button>
      <button class="end hidden" id="endBtn">■ End session</button>
    </div>
  </div>

  <div class="preview">
    <h2>Preview controls (not part of the real app)</h2>
    <div class="row">Time of day <input type="range" id="tod" min="0" max="1000" value="80"> <span id="todLbl"></span></div>
    <div class="row">Season
      <button data-s="0">Spring</button><button data-s="1">Summer</button><button data-s="2" class="on">Autumn</button><button data-s="3">Winter</button>
    </div>
    <div class="row">
      <button id="ffBtn">⏩ Fast-forward day/night</button>
      <button id="upBtn">✨ Show sample upgrades</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
//  Study Buddy — cartoon vector renderer (canvas, smooth paths)
//  Logical scene is 960x600 (16:10), drawn at 2x for crisp edges.
// =====================================================================
const W = 960, H = 600, SC = 2;
const cv = document.getElementById('room');
cv.width = W * SC; cv.height = H * SC;
const mainG = cv.getContext('2d');
function mkLayer() { const c = document.createElement('canvas'); c.width = W * SC; c.height = H * SC; return [c, c.getContext('2d')]; }
const [outC, outG] = mkLayer();   // outside view
const [landC, landG] = mkLayer(); // outside ground objects (darkened at night)
const [roomC, roomG] = mkLayer(); // interior (darkened at night)
const [tintC, tintG] = mkLayer(); // tinted copy of interior
let g = mainG;

const state = { t: 0.08, season: 2, ff: false, upgrades: false, studying: false, paused: false, elapsed: 0, code: 12 };

// ---------- helpers ----------
const OUT = '#3b2a30';
const TAU = Math.PI * 2;
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const css = (a, al = 1) => `rgba(${a[0]},${a[1]},${a[2]},${al})`;
const mixH = (a, b, t) => css(mix(hx(a), hx(b), t));
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function begin(ctx) { g = ctx; g.setTransform(SC, 0, 0, SC, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); }
function poly(pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function paint(fill, stroke = OUT, lw = 3) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = stroke; g.stroke(); }
}
function lg(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function rg(x, y, r, stops) { const gr = g.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function glow(x, y, r, rgb, a) { if (a <= 0) return; g.fillStyle = rg(x, y, r, [[0, css(rgb, a)], [0.45, css(rgb, a * 0.35)], [1, css(rgb, 0)]]); g.fillRect(x - r, y - r, r * 2, r * 2); }
function softShadow(x, y, rx, ry, a = 0.28) {
  g.save(); g.translate(x, y); g.scale(1, ry / rx);
  g.fillStyle = rg(0, 0, rx, [[0, `rgba(70,40,30,${a})`], [0.6, `rgba(70,40,30,${a * 0.6})`], [1, 'rgba(70,40,30,0)']]);
  g.fillRect(-rx, -rx, rx * 2, rx * 2); g.restore();
}
// thick limb (curved) with outline
function limb(a, c, b, w, fill, stroke = OUT) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(a[0], a[1]); g.quadraticCurveTo(c[0], c[1], b[0], b[1]);
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = w + 6; g.stroke(); }
  g.strokeStyle = fill; g.lineWidth = w; g.stroke();
}
// outlined union of circles
function blobs(list, fill, stroke, lw = 3) {
  if (stroke) { g.fillStyle = stroke; for (const [x, y, r] of list) { circ(x, y, r + lw); g.fill(); } }
  g.fillStyle = fill; for (const [x, y, r] of list) { circ(x, y, r); g.fill(); }
}

// ---------- day / night ----------
// t: 0 = sunrise, 0.5 = sunset; [t, top, mid, horizon, daylight, warmth]
const KEYS = [
  [0.00, '#4a5a9a', '#c98fae', '#ffb07a', 0.45, 1],
  [0.05, '#5aa6e6', '#9fd0f0', '#f3e6cf', 0.95, 0.35],
  [0.09, '#4fa3e3', '#8cc9ef', '#d8eef6', 1, 0],
  [0.41, '#4fa3e3', '#8cc9ef', '#d8eef6', 1, 0],
  [0.46, '#5b86cf', '#e9b18e', '#ffd08a', 0.85, 0.6],
  [0.50, '#3c3d86', '#d4708e', '#ff9a5c', 0.45, 1],
  [0.54, '#1d2157', '#4a3a7c', '#8c5a8a', 0.12, 0.35],
  [0.58, '#0a0f2e', '#141d48', '#26305f', 0, 0],
  [0.92, '#0a0f2e', '#141d48', '#26305f', 0, 0],
  [0.96, '#1a2352', '#383c78', '#6e6194', 0.1, 0.3],
  [1.00, '#4a5a9a', '#c98fae', '#ffb07a', 0.45, 1],
];
function sky(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const A = KEYS[i], B = KEYS[i + 1];
    if (t >= A[0] && t <= B[0]) {
      const k = (t - A[0]) / (B[0] - A[0]);
      return { top: mix(hx(A[1]), hx(B[1]), k), mid: mix(hx(A[2]), hx(B[2]), k), bot: mix(hx(A[3]), hx(B[3]), k), day: lerp(A[4], B[4], k), warm: lerp(A[5], B[5], k) };
    }
  }
  return sky(0);
}
function clockStr(t) { // sunrise at 06:00
  const mins = Math.floor(((t * 24 + 6) % 24) * 60);
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
}

// ---------- window / outside ----------
const GX = 72, GY = 72, GW = 236, GH = 218; // glass
const GY0 = 160;                          // ground line (local)
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const stars = (() => { const r = rnd(7); return Array.from({ length: 46 }, () => [r() * GW, r() * (GY0 - 30), r(), r()]); })();
const CLOUDS = [
  { y: 34, s: 1.0, sp: 3.2, off: 0, parts: [[0, 0, 13], [14, -6, 16], [30, 0, 12], [-12, 3, 9], [42, 4, 8]] },
  { y: 70, s: 0.75, sp: 2.1, off: 170, parts: [[0, 0, 12], [13, -5, 14], [27, 1, 10], [-10, 3, 8]] },
  { y: 16, s: 0.6, sp: 4.0, off: 90, parts: [[0, 0, 11], [12, -4, 12], [24, 1, 9]] },
];
const HOUSES = [
  { x: -14, w: 62, h: 52, body: '#d99a82', roof: '#8d4f45', rh: 22, chim: 1 },
  { x: 54, w: 54, h: 64, body: '#a9bfd0', roof: '#56637a', rh: 20, chim: 0 },
  { x: 116, w: 58, h: 48, body: '#e8c98c', roof: '#9a6a43', rh: 24, chim: 1 },
  { x: 182, w: 64, h: 58, body: '#b7a4cf', roof: '#5e4f78', rh: 22, chim: 0 },
];
let houseWins = [];
let particles = [];

function drawSky(time, sk) {
  const night = 1 - sk.day;
  g.fillStyle = lg(0, 0, 0, GY0 + 10, [[0, css(sk.top)], [0.6, css(sk.mid)], [1, css(sk.bot)]]);
  g.fillRect(0, 0, GW, GH);
  // stars
  if (night > 0.35) {
    const a0 = (night - 0.35) / 0.65;
    for (const [x, y, p, q] of stars) {
      const tw = 0.55 + 0.45 * Math.sin(time * (1.5 + q * 2) + p * 30);
      g.fillStyle = `rgba(255,250,225,${a0 * tw})`;
      if (q > 0.88) { // sparkle
        const r = 3.2 * tw; g.beginPath();
        g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill();
      } else { circ(x, y, 0.6 + p * 0.9); g.fill(); }
    }
  }
  // sun / moon arc
  const isDay = state.t < 0.5, p = isDay ? state.t / 0.5 : (state.t - 0.5) / 0.5;
  const bx = 14 + p * (GW - 28), by = GY0 + 6 - Math.sin(Math.PI * p) * 140;
  if (isDay) {
    const low = Math.pow(1 - Math.sin(Math.PI * p), 2);
    const core = mix(hx('#fff4c2'), hx('#ffb36b'), low), rim = mix(hx('#ffd45e'), hx('#ff7f4a'), low);
    glow(bx, by, 70, mix(hx('#fff1b0'), hx('#ffb070'), low), 0.55);
    circ(bx, by, 15); g.fillStyle = rg(bx - 4, by - 4, 18, [[0, css(core)], [1, css(rim)]]); g.fill();
  } else {
    glow(bx, by, 60, [200, 215, 255], 0.35);
    circ(bx, by, 12); g.fillStyle = rg(bx - 3, by - 3, 14, [[0, '#fffbea'], [1, '#e3dfc6']]); g.fill();
    g.fillStyle = 'rgba(190,185,160,0.55)';
    circ(bx + 4, by - 3, 2.6); g.fill(); circ(bx - 3, by + 4, 2); g.fill(); circ(bx + 2, by + 6, 1.3); g.fill();
  }
  // clouds
  const day = sk.day;
  const cLight = mix(mix(hx('#56608f'), hx('#ffd9cc'), clamp(day * 1.6)), hx('#ffffff'), clamp((day - sk.warm * 0.6) * 1.2));
  const cShade = mix(mix(hx('#3a4170'), hx('#e2a0a4'), clamp(day * 1.6)), hx('#d7e6f3'), clamp((day - sk.warm * 0.6) * 1.2));
  const ca = 0.55 + 0.4 * day;
  for (const c of CLOUDS) {
    const span = GW + 140;
    const x = ((time * c.sp + c.off) % span) - 70;
    g.save(); g.translate(x, c.y); g.scale(c.s, c.s); g.globalAlpha = ca;
    g.fillStyle = css(cShade); for (const [px, py, r] of c.parts) { circ(px, py + 2, r); g.fill(); }
    g.fillStyle = css(cLight); for (const [px, py, r] of c.parts) { circ(px - 1, py - 1.5, r * 0.88); g.fill(); }
    g.restore();
  }
}

function drawHouse(h, winter) {
  const top = GY0 - h.h, x = h.x, w = h.w;
  const edge = mixH(h.body, '#3b2a30', 0.45);
  // chimney
  if (h.chim) { rr(x + w * 0.68, top - h.rh + 2, 9, 20, 2); paint(mixH(h.roof, '#000000', 0.15), edge, 1.5); if (winter) { rr(x + w * 0.68 - 1, top - h.rh - 1, 11, 5, 2.5); paint('#f4f8fc', null); } }
  // body
  rr(x, top, w, h.h + 2, 3); paint(h.body, edge, 1.6);
  g.fillStyle = mixH(h.body, '#000000', 0.1); g.fillRect(x + w * 0.62, top + 1, w * 0.38 - 1, h.h); // side shade
  // roof
  g.beginPath(); g.moveTo(x - 6, top + 2); g.lineTo(x + w / 2, top - h.rh); g.lineTo(x + w + 6, top + 2); g.closePath(); paint(h.roof, edge, 1.6);
  g.beginPath(); g.moveTo(x + w / 2, top - h.rh); g.lineTo(x + w + 6, top + 2); g.lineTo(x + w / 2 + 4, top + 2); g.closePath(); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fill();
  if (winter) {
    g.beginPath(); g.moveTo(x - 7, top + 1); g.lineTo(x + w / 2, top - h.rh - 2); g.lineTo(x + w + 7, top + 1);
    g.lineTo(x + w + 2, top + 4); g.quadraticCurveTo(x + w * 0.8, top - 2, x + w * 0.7, top - 4); g.lineTo(x + w / 2, top - h.rh + 6);
    g.lineTo(x + w * 0.3, top - 4); g.quadraticCurveTo(x + w * 0.2, top - 2, x - 2, top + 4); g.closePath();
    g.fillStyle = '#f4f8fc'; g.fill();
  }
  // windows
  const rows = h.h > 55 ? 2 : 1;
  for (let r = 0; r < rows; r++) for (let c = 0; c < 2; c++) {
    const wx = x + 8 + c * (w - 30), wy = top + 9 + r * 24, ww = 14, wh = 13;
    if (r === rows - 1 && c === 0 && rows === 1) continue; // door spot
    rr(wx - 1.5, wy - 1.5, ww + 3, wh + 3, 2); paint('#f6efe2', null);
    rr(wx, wy, ww, wh, 1.5); paint('#6f8fae', null);
    houseWins.push([wx, wy, ww, wh, x * 7 + r * 3 + c]);
  }
  // door
  const dx = rows === 1 ? x + 9 : x + w / 2 - 6;
  rr(dx, GY0 - 20, 12, 21, [5, 5, 0, 0]); paint(mixH(h.roof, '#ffffff', 0.15), edge, 1.2);
  circ(dx + 9, GY0 - 10, 1); paint('#ffe6a0', null);
}

function drawTree(time, x, gy) {
  const s = state.season;
  const sway = Math.sin(time * 0.7) * 0.018;
  g.save(); g.translate(x, gy); g.rotate(sway);
  const bark = '#6e4630', barkD = '#4e3122';
  // trunk
  g.beginPath(); g.moveTo(-8, 4); g.quadraticCurveTo(-5, -30, -4, -58); g.lineTo(4, -58); g.quadraticCurveTo(5, -30, 9, 4); g.closePath();
  paint(bark, barkD, 1.6);
  g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(1, -56, 3, 58);
  const branches = [[-3, -40, -30, -76, 4], [2, -46, 28, -84, 4], [0, -56, -4, -104, 4], [-2, -62, -24, -98, 3], [2, -64, 22, -110, 3], [-14, -60, -40, -86, 2.4], [14, -70, 40, -92, 2.4], [-1, -80, 10, -118, 2.2], [-20, -84, -32, -108, 2]];
  g.lineCap = 'round';
  for (const [x0, y0, x1, y1, w] of branches) {
    g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2 + (x1 > 0 ? -4 : 4), (y0 + y1) / 2, x1, y1);
    g.strokeStyle = barkD; g.lineWidth = w + 1.8; g.stroke(); g.strokeStyle = bark; g.lineWidth = w; g.stroke();
    if (s === 3) { g.beginPath(); g.moveTo(x0 + (x1 > x0 ? 2 : -2), y0 - w * 0.6); g.quadraticCurveTo((x0 + x1) / 2 + (x1 > 0 ? -4 : 4), (y0 + y1) / 2 - w * 0.6, x1, y1 - w * 0.5); g.strokeStyle = '#f6fafd'; g.lineWidth = w * 0.6; g.stroke(); }
  }
  if (s === 3) {
    // twigs + snow tufts
    const r = rnd(5);
    for (const [, , x1, y1] of branches) {
      for (let k = 0; k < 2; k++) { const a = -Math.PI / 2 + (r() - 0.5) * 1.6; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 + Math.cos(a) * 9, y1 + Math.sin(a) * 9); g.strokeStyle = bark; g.lineWidth = 1.2; g.stroke(); }
      ell(x1, y1 - 1.5, 4, 2.2); g.fillStyle = '#f6fafd'; g.fill();
    }
    g.restore(); return;
  }
  const pal = [
    { d: '#4f9a4a', m: '#6dbb5a', l: '#9bd67c' },
    { d: '#2f7d3f', m: '#45a04f', l: '#78c46a' },
    { d: '#c5502c', m: '#e57b36', l: '#f5b043' },
  ][s];
  const big = s === 1 ? 1.12 : 1;
  const cl = [[0, -92, 34], [-28, -78, 24], [28, -80, 25], [-16, -110, 22], [16, -112, 22], [-34, -98, 17], [36, -100, 17], [0, -70, 22]].map(([a, b, r]) => [a * big, b * big + (big - 1) * 30, r * big]);
  blobs(cl, pal.d, mixH(pal.d, '#2a1a1a', 0.35), 1.6);
  g.fillStyle = pal.m; for (const [a, b, r] of cl) { circ(a - r * 0.12, b - r * 0.16, r * 0.82); g.fill(); }
  g.fillStyle = pal.l; for (const [a, b, r] of cl) { circ(a - r * 0.28, b - r * 0.34, r * 0.42); g.fill(); }
  const r = rnd(11);
  if (s === 2) { // mixed red/yellow leaf dots
    for (let i = 0; i < 26; i++) { const a = r() * TAU, d = r() * 40; g.fillStyle = ['#d8452b', '#f6c544', '#b8381f'][i % 3]; ell(Math.cos(a) * d * 1.1, -92 + Math.sin(a) * d * 0.8, 2.4, 1.6, a); g.fill(); }
  }
  if (s === 0) { // blossoms
    for (let i = 0; i < 34; i++) {
      const a = r() * TAU, d = Math.sqrt(r()) * 42, bx = Math.cos(a) * d * 1.05, by = -92 + Math.sin(a) * d * 0.8;
      g.fillStyle = i % 3 ? '#f7b5cf' : '#fde4ee';
      for (let k = 0; k < 5; k++) { circ(bx + Math.cos(k * TAU / 5) * 1.7, by + Math.sin(k * TAU / 5) * 1.7, 1.5); g.fill(); }
      circ(bx, by, 0.9); g.fillStyle = '#f2b134'; g.fill();
    }
  }
  g.restore();
}

function drawLamp() {
  const x = 30, base = GH - 2;
  g.fillStyle = '#2f3142';
  rr(x - 5, base - 8, 10, 8, 2); g.fill();
  rr(x - 2, 60, 4, base - 60, 2); g.fill();
  // lantern
  g.beginPath(); g.moveTo(x - 8, 52); g.lineTo(x + 8, 52); g.lineTo(x + 5, 64); g.lineTo(x - 5, 64); g.closePath(); g.fill();

function updateParticles(dt, time) {
  const s = state.season;
  const rate = [3, 0, 4, 22][s];
  let n = rate * dt; while (n > 0) {
    if (Math.random() < n) {
      if (s === 3) particles.push({ k: 'snow', x: Math.random() * (GW + 40), y: -4, vx: -6 - Math.random() * 4, vy: 14 + Math.random() * 10, s: 0.8 + Math.random() * 1.6, c: '#ffffff', rot: 0, vr: 0, ph: Math.random() * 6 });
      else particles.push({ k: s === 0 ? 'petal' : 'leaf', x: 166 + (Math.random() - 0.5) * 80, y: GY0 - 100 + Math.random() * 50, vx: -8 - Math.random() * 6, vy: 9 + Math.random() * 6, s: s === 0 ? 1.6 : 2.2, c: s === 0 ? (Math.random() < 0.5 ? '#f7b5cf' : '#fbd3e2') : ['#e2572e', '#f2a03a', '#f6c544', '#c7412a'][Math.random() * 4 | 0], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 4, ph: Math.random() * 6 });
    }
    n -= 1;
  }
  for (const p of particles) { p.x += (p.vx + Math.sin(time * 2 + p.ph) * 8) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  particles = particles.filter(p => p.y < GH + 4 && p.x > -10);
}

function softPoly(q, rgb, a, spread = 7) { // soft-edged polygon without filters

    poly(q.map(([x, y]) => { const dx = x - cx, dy = y - cy, L = Math.hypot(dx, dy) || 1; return [x + dx / L * d, y + dy / L * d]; }));
    g.fillStyle = css(rgb, a / 5); g.fill();
  }
}

function drawCurtains(time) {

    g.quadraticCurveTo(xt - side * -14 + sway, tie + 60, xi + side * 14 + sway, bot);
    g.lineTo(xo + side * -2, bot); g.quadraticCurveTo(xo - side * 4, (top + bot) / 2, xo, top); g.closePath();
    g.fillStyle = lg(Math.min(xo, xi), 0, Math.max(xo, xi), 0, side < 0 ? [[0, '#c45a45'], [1, '#e07a5c']] : [[0, '#d26a50'], [1, '#b8503d']]);

    }

    for (let k = 1; k < 4; k++) { const fx = lerp(xo, xi, k / 4) + 6; g.beginPath(); g.moveTo(fx, top + 6); g.quadraticCurveTo(lerp(fx, xt, 0.8), tie - 14, lerp(fx, xt, 0.95), tie - 4); g.stroke(); }

  g.strokeStyle = 'rgba(40,50,90,0.45)'; g.lineWidth = 2; g.beginPath(); g.moveTo(390, 404); g.lineTo(488, 404); g.stroke();
  // collar ring
  g.beginPath(); g.ellipse(446, 298, 22, 9, 0.05, 0, TAU); paint(HOOD_D, OUT, 2.5);
  // strings
  g.lineCap = 'round';
  for (const [x0, x1] of [[454, 457], [466, 471]]) {
    g.beginPath(); g.moveTo(x0, 302); g.quadraticCurveTo(x0 + 2, 320, x1, 338); g.strokeStyle = '#f3ead8'; g.lineWidth = 2.5; g.stroke();
    circ(x1, 340, 2.5); paint('#f3ead8', OUT, 1.2);
  }
}
function drawHead(P, time) {
  g.save();
  g.translate(444, 296); g.rotate(P.tilt); g.translate(-444, -296 + P.bob);
  // neck
  rr(434, 270, 22, 30, 8); paint(SKIN_D, OUT, 2.5);
  const cx = 450, cy = 236, R = 54;
  // back hair volume
  blobs([[cx - 14, cy - 6, R + 2], [cx - 30, cy + 10, 30]], HAIR, OUT, 3);
  // face
  g.beginPath(); g.ellipse(cx + 6, cy + 4, R - 2, R - 4, 0, 0, TAU);
  g.fillStyle = rg(cx + 22, cy + 6, 70, [[0, '#f9d3b0'], [0.7, SKIN], [1, SKIN_D]]); g.fill(); g.lineWidth = 3; g.strokeStyle = OUT; g.stroke();
  // hair cap + fringe
  g.beginPath();
  g.moveTo(cx - 52, cy + 24);
  g.bezierCurveTo(cx - 66, cy - 20, cx - 40, cy - 64, cx + 2, cy - 62);
  g.bezierCurveTo(cx + 42, cy - 62, cx + 66, cy - 36, cx + 60, cy - 10);
  g.quadraticCurveTo(cx + 52, cy - 22, cx + 44, cy - 12);
  g.quadraticCurveTo(cx + 38, cy - 30, cx + 24, cy - 16);
  g.quadraticCurveTo(cx + 14, cy - 34, cx - 2, cy - 18);
  g.quadraticCurveTo(cx - 12, cy - 14, cx - 14, cy);
  g.quadraticCurveTo(cx - 12, cy + 14, cx - 18, cy + 28);
  g.quadraticCurveTo(cx - 36, cy + 34, cx - 52, cy + 24);
  g.closePath();
  g.fillStyle = HAIR; g.fill(); g.lineWidth = 3; g.strokeStyle = OUT; g.stroke();
  // hair highlight (light from window, upper-left)
  g.save(); g.clip();
  g.strokeStyle = HAIR_L; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.arc(cx - 6, cy - 6, 46, Math.PI * 1.08, Math.PI * 1.42); g.stroke();
  g.strokeStyle = HAIR_D; g.lineWidth = 2.5;
  for (const [a, b] of [[-30, -40], [-40, -10], [-20, -50]]) { g.beginPath(); g.moveTo(cx + a, cy + b); g.quadraticCurveTo(cx + a - 10, cy + b + 14, cx + a - 6, cy + b + 30); g.stroke(); }
  g.restore();
  if (!state.upgrades) { // cowlick
    g.beginPath(); g.moveTo(cx - 6, cy - 60); g.quadraticCurveTo(cx - 4, cy - 82, cx + 14, cy - 80); g.quadraticCurveTo(cx + 2, cy - 74, cx + 6, cy - 61);
    paint(HAIR, OUT, 2.5);
  }
  // ear
  ell(cx - 22, cy + 10, 10, 13); paint(SKIN, OUT, 2.5);
  g.beginPath(); g.arc(cx - 21, cy + 10, 5, -1.2, 1.4); g.strokeStyle = SKIN_D; g.lineWidth = 2.5; g.stroke();
  // eyebrows
  g.strokeStyle = HAIR_D; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx + 8, cy - 4); g.quadraticCurveTo(cx + 15, cy - 9, cx + 22, cy - 6); g.stroke();
  g.beginPath(); g.moveTo(cx + 38, cy - 7); g.quadraticCurveTo(cx + 44, cy - 10, cx + 49, cy - 7); g.stroke();
  // eyes
  const ey = cy + 10;
  const sip = P.sip > 0.6;
  if (P.blink || sip) {
    g.strokeStyle = OUT; g.lineWidth = 3;
    g.beginPath(); g.arc(cx + 16, ey + (sip ? 2 : 0), 6, sip ? Math.PI + 0.4 : 0.3, sip ? -0.4 : Math.PI - 0.3); g.stroke();
    g.beginPath(); g.arc(cx + 44, ey + (sip ? 1 : 0), 5, sip ? Math.PI + 0.4 : 0.3, sip ? -0.4 : Math.PI - 0.3); g.stroke();
  } else {
    ell(cx + 16, ey, 6.5, 8.5); paint('#2b2030', null);
    ell(cx + 44, ey - 1, 5, 7.8); paint('#2b2030', null);
    circ(cx + 18.5, ey - 3.5, 2.4); paint('#ffffff', null); circ(cx + 14, ey + 3, 1.1); paint('rgba(255,255,255,0.7)', null);
    circ(cx + 46, ey - 4, 1.9); paint('#ffffff', null);
  }
  // blush
  g.fillStyle = 'rgba(240,130,120,0.38)'; ell(cx + 14, cy + 26, 9, 5); g.fill(); ell(cx + 50, cy + 24, 5, 4); g.fill();
  // nose
  g.beginPath(); g.moveTo(cx + 34, cy + 16); g.quadraticCurveTo(cx + 40, cy + 22, cx + 33, cy + 24); g.strokeStyle = SKIN_D; g.lineWidth = 2.5; g.stroke();
  // mouth
  g.strokeStyle = OUT; g.lineWidth = 2.6;
  if (P.typing) { g.beginPath(); g.moveTo(cx + 26, cy + 34); g.quadraticCurveTo(cx + 32, cy + 37, cx + 38, cy + 33); g.stroke(); }
  else { g.beginPath(); g.moveTo(cx + 24, cy + 32); g.quadraticCurveTo(cx + 32, cy + 41, cx + 40, cy + 31); g.stroke(); }
  // beanie
  if (state.upgrades) {
    g.beginPath();
    g.moveTo(cx - 56, cy - 2);
    g.bezierCurveTo(cx - 62, cy - 58, cx - 20, cy - 76, cx + 8, cy - 74);
    g.bezierCurveTo(cx + 44, cy - 72, cx + 66, cy - 44, cx + 62, cy - 14);
    g.closePath(); paint(lg(cx - 60, 0, cx + 60, 0, [[0, '#e0614f'], [1, '#c4473a']]), OUT, 3);
    g.save(); g.clip(); g.strokeStyle = 'rgba(120,30,25,0.35)'; g.lineWidth = 3;
    for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(cx + k * 14, cy - 10); g.quadraticCurveTo(cx + k * 15, cy - 50, cx + k * 6, cy - 80); g.stroke(); }
    g.restore();
    // cuff
    g.beginPath(); g.moveTo(cx - 58, cy - 6); g.quadraticCurveTo(cx, cy - 30, cx + 64, cy - 18);
    g.lineTo(cx + 64, cy - 4); g.quadraticCurveTo(cx, cy - 16, cx - 56, cy + 10); g.closePath();
    paint('#b33a30', OUT, 3);
    g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 50, cy - 4); g.quadraticCurveTo(cx, cy - 26, cx + 58, cy - 15); g.stroke();
    // little fringe tufts peeking out
    g.beginPath(); g.moveTo(cx + 30, cy - 10); g.quadraticCurveTo(cx + 40, cy + 2, cx + 46, cy - 8); g.quadraticCurveTo(cx + 54, cy + 2, cx + 60, cy - 6); g.lineTo(cx + 60, cy - 8); g.closePath(); paint(HAIR, OUT, 2);
    // pompom
    blobs([[cx - 14, cy - 80, 9], [cx - 6, cy - 84, 9], [cx - 10, cy - 74, 8], [cx - 2, cy - 76, 8]], '#f6efe2', OUT, 2.5);
  }
  g.restore();
}
function drawArm(sh, el, hand, col, mug, tiltMug) {
  limb(sh, el, el, 22, col);
  limb(el, [lerp(el[0], hand[0], 0.5), lerp(el[1], hand[1], 0.5) + 2], hand, 20, col);
  // cuff
  const dx = hand[0] - el[0], dy = hand[1] - el[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const cx = hand[0] - ux * 12, cy = hand[1] - uy * 12;
  g.beginPath(); g.moveTo(cx - uy * 11, cy + ux * 11); g.lineTo(cx + uy * 11, cy - ux * 11); g.strokeStyle = OUT; g.lineWidth = 9; g.lineCap = 'round'; g.stroke(); g.strokeStyle = HOOD_D; g.lineWidth = 5; g.stroke();
  if (mug) mugAt(hand[0] + 4, hand[1] + 8, tiltMug);
  if (mug) { circ(hand[0], hand[1], 9); paint(SKIN, OUT, 2.5); }
  else { ell(hand[0] + ux * 2, hand[1] + uy * 2, 11, 7.5, Math.atan2(uy, ux) * 0.4); paint(SKIN, OUT, 2.5); }
  if (mug) { g.beginPath(); g.arc(hand[0] + 3, hand[1] + 1, 5, -0.5, 1.6); g.strokeStyle = SKIN_D; g.lineWidth = 2; g.stroke(); }
}

function drawCharacter(time) {
  const P = pose(time);
  drawChairBase();
  drawChairBack(P);
  drawSeat();
  drawLegs();
  g.save(); g.translate(436, 408); g.rotate(P.lean); g.translate(-436, -408);
  // far arm
  drawArm([452, 316], P.farElbow, P.farHand, HOOD_D, false);
  drawTorso(P);
  drawHead(P, time);
  drawArm([466, 322], P.nearElbow, P.nearHand, HOOD, P.mugInHand, -P.sip * 0.7);
  g.restore();
  return P;
}

function steam(x, y, time, a) {
  g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const k = (time * 0.45 + i / 3) % 1;
    const sx = x - 5 + i * 5, sy = y - k * 36;
    g.strokeStyle = `rgba(255,255,255,${a * Math.sin(k * Math.PI)})`; g.lineWidth = 4 - k * 2;
    g.beginPath(); g.moveTo(sx, sy);
    g.bezierCurveTo(sx + 7 * Math.sin(time * 2 + i), sy - 6, sx - 7 * Math.sin(time * 2 + i), sy - 12, sx + Math.sin(time * 1.5 + i) * 3, sy - 18); g.stroke();
  }
}

// ---------- compose ----------
let lastPose = null;
function render(time) {
  const sk = sky(state.t), night = 1 - sk.day;
  const typing = state.studying && !state.paused;
  drawOutside(time, sk);

  // ---- room layer ----
  begin(roomG);
  drawStatic();
  if (state.upgrades) drawRug();
  drawSunPatch(sk);
  drawCurtains(time);
  drawSillPlant(time);
  drawClock();
  if (state.upgrades) drawPoster();
  drawDesk();
  drawMonitorBody(MON, 606);
  if (state.upgrades) { drawMonitorBody(MON2, 735); drawDeskLamp(); }
  drawKeyboard(time, typing);
  const mugX = state.upgrades ? 676 : 724, mugY = 366;
  if (typing) { softShadow(mugX, mugY + 1, 16, 4, 0.3); mugAt(mugX, mugY); }
  if (state.upgrades) drawCat(time);
  const P = drawCharacter(time);
  // night & warm tint
  // multiply-tint keeps colours saturated; destination-in restores the glass hole
  const tint = mix(mix([255, 255, 255], [255, 196, 150], sk.warm * 0.55), [58, 66, 132], night);
  if (night > 0.01 || sk.warm > 0.01) {
    g = tintG; g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'copy'; g.drawImage(roomC, 0, 0);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = css(tint); g.fillRect(0, 0, tintC.width, tintC.height);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(roomC, 0, 0);
    g.globalCompositeOperation = 'source-over';
  }
  const roomOut = (night > 0.01 || sk.warm > 0.01) ? tintC : roomC;

  // ---- main composite ----
  g = mainG; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  g.drawImage(outC, 0, 0); g.drawImage(roomOut, 0, 0);
  g.setTransform(SC, 0, 0, SC, 0, 0);
  // glass reflections
  g.save(); g.beginPath(); g.rect(GX, GY, GW, GH); g.clip();
  g.fillStyle = `rgba(255,255,255,${0.07 + 0.03 * sk.day})`;
  poly([[GX + 20, GY + GH], [GX + 60, GY + GH], [GX + 150, GY], [GX + 110, GY]]); g.fill();
  poly([[GX + 70, GY + GH], [GX + 82, GY + GH], [GX + 172, GY], [GX + 160, GY]]); g.fill();
  g.restore();
  // screens (emissive)
  drawScreenContent(MON, time, night);
  if (state.upgrades) drawScreen2(MON2, time);
  // glows
  g.globalCompositeOperation = 'lighter';
  glow(MON.x + MON.w / 2, MON.y + MON.h / 2 + 10, 230, [80, 120, 255], 0.03 + 0.11 * night);
  glow(MON.x + 10, MON.y + MON.h / 2, 90, [120, 160, 255], 0.04 + 0.14 * night);
  glow(486, 250, 70, [130, 170, 255], 0.16 * night);
  if (state.upgrades) {
    glow(MON2.x + MON2.w / 2, MON2.y + MON2.h / 2, 140, [90, 220, 170], 0.03 + 0.1 * night);
    const lx = LAMP.hx - 4, ly = LAMP.hy + 10;
    glow(lx, ly + 20, 220, [255, 170, 90], 0.03 + 0.26 * night);
    glow(lx - 10, DESK.back + 20, 110, [255, 190, 110], 0.24 * night);
    g.fillStyle = lg(0, ly, 0, DESK.front, [[0, `rgba(255,200,120,${0.22 * night})`], [1, 'rgba(255,200,120,0)']]);
    poly([[lx - 14, ly], [lx + 8, ly + 8], [lx + 30, DESK.front], [lx - 70, DESK.front]]); g.fill();
  }
  if (night > 0.05) { // moonlight patch
    softPoly([[150, 432], [372, 432], [480, 590], [210, 590]], [120, 150, 255], 0.04 * night, 16);
  }
  g.globalCompositeOperation = 'source-over';
  if (state.upgrades) lampBulb(night);
  // steam
  const sa = 0.55 - 0.25 * night;
  if (typing) steam(mugX, mugY - 28, time, sa);
  else if (P.sip < 0.3) {
    const nh = P.nearHand; // approximate mug top in world (body lean)
    steam(nh[0] + 2 + P.lean * 60, nh[1] - 22, time, sa);
  }
  // vignette
  const vg = g.createRadialGradient(W / 2, H * 0.55, H * 0.4, W / 2, H * 0.55, W * 0.68);
  vg.addColorStop(0, 'rgba(30,15,20,0)'); vg.addColorStop(1, `rgba(30,15,20,${0.22 + 0.15 * night})`);
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

// ---------- loop & UI ----------
const $ = id => document.getElementById(id);
let last = performance.now();
function fmt(s) { s = Math.floor(s); return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':'); }
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (state.ff) { state.t = (state.t + dt / 20) % 1; $('tod').value = state.t * 1000; }
  if (state.studying && !state.paused) { state.elapsed += dt; state.code += dt * 0.7; if (!state.ff) state.t = (state.t + dt / 3600) % 1; }
  updateParticles(dt, now / 1000);
  $('timer').textContent = fmt(state.elapsed);
  $('todLbl').textContent = clockStr(state.t) + (state.t < 0.5 ? ' ☀️' : ' 🌙');
  $('simbar').textContent = `Day 43 · ${SEASONS[state.season]} (day 3/10) · ${clockStr(state.t)}`;
  render(now / 1000);
  requestAnimationFrame(frame);
}

$('tod').oninput = e => { state.t = e.target.value / 1000; state.ff = false; $('ffBtn').classList.remove('on'); };
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  state.season = +b.dataset.s; warmParticles();
  document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
});
$('ffBtn').onclick = () => { state.ff = !state.ff; $('ffBtn').classList.toggle('on', state.ff); };
$('upBtn').onclick = () => { state.upgrades = !state.upgrades; $('upBtn').classList.toggle('on', state.upgrades); };
$('startBtn').onclick = () => {
  state.studying = true; state.paused = false;
  $('startBtn').classList.add('hidden'); $('pauseBtn').classList.remove('hidden'); $('endBtn').classList.remove('hidden');
  $('sub').textContent = 'Studying… next coin in 59:59';
};
$('pauseBtn').onclick = () => {
  state.paused = !state.paused; $('pauseBtn').textContent = state.paused ? '▶ Resume' : '❚❚ Pause';
  $('sub').textContent = state.paused ? 'Paused' : 'Studying…';
};
$('endBtn').onclick = () => {
  state.studying = false; state.paused = false; state.elapsed = 0;
  $('startBtn').classList.remove('hidden'); $('pauseBtn').classList.add('hidden'); $('endBtn').classList.add('hidden');
  $('pauseBtn').textContent = '❚❚ Pause'; $('sub').textContent = 'Session saved! (preview only)';
};
// URL params for screenshots: ?t=0.2&s=1&u=1&study=1
const q = new URLSearchParams(location.search);
if (q.has('t')) state.t = +q.get('t');
if (q.has('s')) document.querySelector(`[data-s="${q.get('s')}"]`).click(); else warmParticles();
if (q.get('u') === '1') $('upBtn').click();
if (q.get('study') === '1') $('startBtn').click();
$('tod').value = state.t * 1000;
requestAnimationFrame(frame);
</script>
